name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      # No Discord token and no database service: the suite mocks HTTP and runs
      # against SQLite, so CI needs no secrets at all. PostgreSQL tests live
      # in their own job.
      - name: pytest
        run: pytest -q -m "not postgres"

  postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acm_hub
          POSTGRES_PASSWORD: acm_hub
          POSTGRES_DB: acm_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acm_hub -d acm_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: PostgreSQL integration tests
        env:
          ACMHUB_POSTGRES_URL: postgresql+asyncpg://acm_hub:acm_hub@localhost:5432/acm_hub_test
        run: pytest -m postgres -q


  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: acm-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and reports invalid configuration
        # Proves the entrypoint runs and fails cleanly (exit 2) rather than
        # crashing with a traceback when no configuration is supplied.
        run: |
          set +e
          output=$(docker run --rm acm-hub:ci 2>&1)
          code=$?
          echo "$output"
          test "$code" -eq 2 || { echo "expected exit code 2, got $code"; exit 1; }
          echo "$output" | grep -q "configuration is invalid"

[project]
name = "acm-hub"
version = "0.1.0"
description = "Discord bot that discovers and organizes technical opportunities for ACM at Arizona State University."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.4,<3",
    "SQLAlchemy[asyncio]>=2.0.30,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.31",
    "httpx>=0.27,<0.29",
    "APScheduler>=3.10,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5.0,<8",
    "respx>=0.21,<0.23",
    "aiosqlite>=0.20,<0.22",
    "ruff>=0.6,<0.15",
    "mypy>=1.10,<2",
]

[project.scripts]
acm-hub = "acm_hub.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acm_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "BLE",  # blind except - every one must be justified with a noqa
    "S",    # bandit security checks
    "T20",  # print statements must be justified
    "SLF",  # private member access
    "RUF",
]
ignore = [
    "B008",  # discord.py decorators legitimately call functions in defaults
    "S101",  # asserts are used as internal invariants, and freely in tests
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:acm_hub.*"]
